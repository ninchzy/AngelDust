<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tells browsers the site has its own dark theme, so they don't auto-darken it -->
    <meta name="color-scheme" content="light dark">
    <script>
        // The site always opens in the light theme. A switch to dark is kept only for
        // this browser tab (so refreshing doesn't flash back), set before the page paints.
        (function () {
            var theme = 'light';
            try {
                if (sessionStorage.getItem('angeldust.theme') === 'dark') theme = 'dark';
            } catch (e) { /* storage unavailable */ }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Angel Dust · Sweet Lolita Atelier</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
